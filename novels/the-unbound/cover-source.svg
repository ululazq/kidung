<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1184" width="880" height="1184">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1830"/>
      <stop offset="0.35" stop-color="#16304f"/>
      <stop offset="0.6" stop-color="#2f5270"/>
      <stop offset="0.78" stop-color="#6a7f8f"/>
      <stop offset="0.88" stop-color="#c98a52"/>
      <stop offset="1" stop-color="#e8b878"/>
    </linearGradient>
    <radialGradient id="horizonGlow" cx="0.5" cy="0.92" r="0.55">
      <stop offset="0" stop-color="#f3cf8f" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#d99a55" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#d99a55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloudTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ecdd" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#c9cede" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#93a7bd" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="cloudLow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c6d6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7e95ab" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="island" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4152"/>
      <stop offset="1" stop-color="#141a28"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c1119"/>
      <stop offset="0.5" stop-color="#1d2533"/>
      <stop offset="1" stop-color="#0c1119"/>
    </linearGradient>
    <radialGradient id="markGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffdf8a" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#f2a94e" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f2a94e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="880" height="1184" fill="url(#sky)"/>
  <rect width="880" height="1184" fill="url(#horizonGlow)"/>

  <!-- Stars -->
  <g fill="#dfe9f5" opacity="0.8">
    <circle cx="120" cy="90" r="1.6"/><circle cx="280" cy="60" r="1.2"/>
    <circle cx="430" cy="120" r="1.5"/><circle cx="600" cy="70" r="1.2"/>
    <circle cx="720" cy="140" r="1.7"/><circle cx="200" cy="170" r="1.1"/>
    <circle cx="520" cy="190" r="1.3"/><circle cx="790" cy="60" r="1.1"/>
    <circle cx="80" cy="210" r="1.2"/><circle cx="350" cy="230" r="1.4"/>
    <circle cx="660" cy="240" r="1.1"/><circle cx="150" cy="120" r="1.0"/>
  </g>

  <!-- Sunpillar (distant shaft to the deep) -->
  <rect x="150" y="180" width="54" height="1004" fill="url(#pillar)" opacity="0.85"/>
  <g fill="#f2c37a" opacity="0.7">
    <circle cx="177" cy="520" r="2.2"/><circle cx="177" cy="610" r="2.0"/>
    <circle cx="177" cy="700" r="2.2"/><circle cx="177" cy="790" r="2.0"/>
    <circle cx="177" cy="880" r="2.2"/><circle cx="177" cy="340" r="2.0"/>
    <circle cx="177" cy="430" r="2.2"/>
  </g>

  <!-- Floating islands (Skyreach) -->
  <g fill="url(#island)">
    <path d="M40 560 L60 512 L110 498 L168 510 L196 540 L188 574 L120 592 L60 588 Z"/>
    <path d="M640 470 L668 430 L730 418 L800 434 L826 468 L816 500 L748 516 L672 506 Z"/>
    <path d="M470 640 L500 606 L560 596 L618 610 L634 642 L620 668 L556 678 L496 668 Z"/>
  </g>
  <!-- Roots hanging beneath islands -->
  <g stroke="#232a3a" stroke-width="3" opacity="0.9" fill="none">
    <path d="M120 592 Q116 630 108 660"/>
    <path d="M150 590 Q152 640 146 680"/>
    <path d="M748 516 Q752 560 744 600"/>
    <path d="M776 512 Q780 556 772 592"/>
    <path d="M556 678 Q558 716 550 748"/>
  </g>

  <!-- The Falls: a broken island dropping rocks into the cloud sea -->
  <g>
    <path d="M700 860 L726 830 L782 820 L830 838 L842 866 L822 892 L760 900 L716 888 Z" fill="#333a4b"/>
    <g fill="#2b3242">
      <circle cx="790" cy="930" r="7"/><circle cx="814" cy="956" r="5"/>
      <circle cx="804" cy="990" r="4"/><circle cx="826" cy="1006" r="3.5"/>
      <circle cx="838" cy="1030" r="3"/>
    </g>
  </g>

  <!-- Cloud sea (lower third) -->
  <g>
    <ellipse cx="180" cy="1120" rx="320" ry="120" fill="url(#cloudLow)"/>
    <ellipse cx="560" cy="1150" rx="360" ry="130" fill="url(#cloudLow)"/>
    <ellipse cx="880" cy="1100" rx="300" ry="110" fill="url(#cloudLow)"/>
    <ellipse cx="120" cy="1010" rx="280" ry="90" fill="url(#cloudTop)"/>
    <ellipse cx="470" cy="990" rx="300" ry="95" fill="url(#cloudTop)"/>
    <ellipse cx="760" cy="1020" rx="260" ry="85" fill="url(#cloudTop)"/>
    <ellipse cx="320" cy="960" rx="220" ry="70" fill="#f4ecdd" opacity="0.8"/>
    <ellipse cx="640" cy="950" rx="200" ry="65" fill="#f4ecdd" opacity="0.7"/>
  </g>

  <!-- Distant city lights of the Heartland far below (through a cloud gap) -->
  <g fill="#ffd98a" opacity="0.85">
    <circle cx="430" cy="1040" r="1.4"/><circle cx="452" cy="1046" r="1.2"/>
    <circle cx="470" cy="1038" r="1.5"/><circle cx="492" cy="1048" r="1.1"/>
    <circle cx="510" cy="1042" r="1.3"/><circle cx="445" cy="1060" r="1.0"/>
  </g>

  <!-- Foreground: the Gullsong deck & rigging (silhouette) -->
  <g fill="#0d1320">
    <path d="M0 1184 L0 1062 Q120 1038 260 1050 Q420 1064 560 1052 Q720 1040 880 1058 L880 1184 Z"/>
  </g>
  <g stroke="#0d1320" stroke-linecap="round">
    <!-- mast -->
    <line x1="560" y1="320" x2="560" y2="1060" stroke-width="10"/>
    <!-- cross-spars -->
    <line x1="430" y1="420" x2="690" y2="420" stroke-width="6"/>
    <line x1="470" y1="620" x2="650" y2="620" stroke-width="5"/>
    <line x1="505" y1="830" x2="615" y2="830" stroke-width="4"/>
    <!-- rigging ropes -->
    <line x1="560" y1="330" x2="300" y2="1060" stroke-width="2.5" opacity="0.9"/>
    <line x1="560" y1="330" x2="820" y2="1060" stroke-width="2.5" opacity="0.9"/>
    <line x1="560" y1="430" x2="380" y2="620" stroke-width="2" opacity="0.8"/>
    <line x1="560" y1="430" x2="740" y2="620" stroke-width="2" opacity="0.8"/>
    <line x1="430" y1="420" x2="240" y2="1060" stroke-width="2" opacity="0.7"/>
    <line x1="690" y1="420" x2="880" y2="1060" stroke-width="2" opacity="0.7"/>
    <!-- a torn sail, wind-whipped -->
    <path d="M560 420 Q470 520 500 620 Q450 700 480 780 Q420 860 470 900" stroke-width="2.5" opacity="0.6" fill="none"/>
  </g>

  <!-- Sorin: silhouette from behind, arm extended -->
  <g fill="#0a0f1a">
    <path d="M470 1060 Q468 940 500 900 Q520 880 556 878 Q600 878 616 902 Q640 940 634 1060 Z"/>
    <circle cx="556" cy="856" r="24"/>
    <!-- raised LEFT arm toward the abyss (the Compass is on Sorin's left palm — canon) -->
    <path d="M500 900 Q430 880 390 850" stroke="#0a0f1a" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M590 900 Q660 890 700 870" stroke="#0a0f1a" stroke-width="12" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Glowing Compass mark on the left palm -->
  <circle cx="390" cy="844" r="64" fill="url(#markGlow)" filter="url(#soft2)"/>
  <circle cx="390" cy="844" r="34" fill="url(#markGlow)" filter="url(#soft)"/>
  <g stroke="#ffe9ad" stroke-width="3.2" fill="none" opacity="0.98">
    <circle cx="390" cy="844" r="26"/>
    <circle cx="390" cy="844" r="17" stroke-width="1.6" opacity="0.8"/>
    <!-- compass cardinal ticks -->
    <line x1="390" y1="812" x2="390" y2="822" stroke-width="2.2"/>
    <line x1="390" y1="866" x2="390" y2="876" stroke-width="2.2"/>
    <line x1="358" y1="844" x2="368" y2="844" stroke-width="2.2"/>
    <line x1="412" y1="844" x2="422" y2="844" stroke-width="2.2"/>
    <!-- the needle, pointing DOWN -->
    <path d="M390 828 L400 856 L390 850 L380 856 Z" fill="#ffdf8a" stroke="none"/>
    <line x1="390" y1="830" x2="390" y2="858" stroke-width="2.6" stroke="#fff3cf"/>
  </g>

  <!-- Falling light motes around the mark -->
  <g fill="#ffe9ad" opacity="0.8">
    <circle cx="342" cy="812" r="1.6"/><circle cx="430" cy="826" r="1.4"/>
    <circle cx="368" cy="800" r="1.2"/><circle cx="420" cy="872" r="1.5"/>
    <circle cx="356" cy="878" r="1.2"/><circle cx="436" cy="852" r="1.3"/>
  </g>

  <!-- Title typography -->
  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="440" y="176" font-size="86" font-weight="bold" letter-spacing="10" fill="#f2e8d0" opacity="0.92">THE UNBOUND</text>
    <line x1="300" y1="206" x2="580" y2="206" stroke="#d9b878" stroke-width="1.6" opacity="0.9"/>
    <text x="440" y="246" font-size="24" letter-spacing="8" fill="#c9b78a" opacity="0.95">SKYROOT · BOOK ONE</text>
  </g>

  <!-- subtle vignette -->
  <rect width="880" height="1184" fill="url(#sky)" opacity="0">
    <animate attributeName="opacity" values="0;0" dur="1s"/>
  </rect>
  <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
    <stop offset="0.62" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.38"/>
  </radialGradient>
  <rect width="880" height="1184" fill="url(#vig)"/>
</svg>
